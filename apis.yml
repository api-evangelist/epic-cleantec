aid: epic-cleantec
name: Epic CleanTec
description: 'Epic Cleantec is a San Francisco based water technology company that designs,
  builds and operates onsite water reuse systems for buildings. Its OneWater and OneWater
  Rain systems collect, treat and recycle a building''s greywater, blackwater, rainwater
  and condensate onsite — recovering up to 95% of wastewater for non-potable uses such
  as toilet flushing, irrigation, cooling towers and laundry — alongside wastewater heat
  recovery and a soil amendment product line. The technology grew out of work on the Bill
  and Melinda Gates Foundation Reinvent the Toilet Challenge and is deployed in multifamily,
  commercial office, hospitality, stadium, data center, higher education and community-scale
  developments across North America. Systems ship with PLC/SCADA control and a cloud-connected
  Eco-Insights reporting dashboard for remote monitoring, alarms and utility savings reporting,
  but Epic Cleantec publishes no public developer program, API documentation or machine-readable
  API contract; the data surface is delivered to building owners and operators as a hosted
  dashboard rather than as a public API.'
